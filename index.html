<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Test - Intégration SaaS</title>
    <!-- Tailwind CSS pour un design moderne et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4">
        <div class="max-w-3xl mx-auto px-4">
            <h1 class="text-2xl font-bold text-red-600">Eva's Touch (Démo API)</h1>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden md:flex">
            
            <!-- Image Produit -->
            <div class="md:w-1/2 bg-gray-100 p-8 flex flex-col justify-center items-center">
                <div class="w-48 h-48 bg-gray-200 rounded-xl mb-4 flex items-center justify-center">
                    <span class="text-gray-400">Image Produit</span>
                </div>
                <h2 class="text-xl font-bold text-gray-800 text-center">Tablier de cuisine imperméable</h2>
                <p class="text-gray-500 mt-2">Couleur : Rose</p>
                <p class="text-2xl font-bold text-red-600 mt-4">1 800 DA</p>
            </div>

            <!-- Formulaire de Commande -->
            <div class="md:w-1/2 p-6 md:p-8">
                <h3 class="text-lg font-bold mb-4">Passer commande</h3>
                
                <form id="orderForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
                        <input type="text" id="nom" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" placeholder="Ex: Amine">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
                        <input type="tel" id="telephone" required pattern="^(05|06|07)[0-9]{8}$" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" placeholder="0550 00 00 00">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Wilaya</label>
                            <input type="text" id="wilaya" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" placeholder="Alger">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Commune</label>
                            <input type="text" id="commune" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" placeholder="Bab Ezzouar">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Quantité</label>
                        <input type="number" id="quantite" value="1" min="1" max="10" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                    </div>

                    <!-- Message de statut -->
                    <div id="statusMessage" class="hidden p-3 rounded-lg text-sm font-medium text-center"></div>

                    <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center">
                        <span>Confirmer l'achat</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // ⚠️ VARIABLES À REMPLACER PAR TES CLÉS SAAS
        // ==========================================
        const SUPABASE_URL = "https://[TON_URL].supabase.co"; 
        const SUPABASE_ANON_KEY = "ey...[TA_CLE_PUBLIQUE_ANON]";
        
        // Les clés générées depuis ton application mobile
        const API_KEY_CLIENT = "sk_live_...[TA_CLE_API_SAAS]"; 
        const PRODUIT_ID = "[ID_DU_TABLIER_DANS_TA_BASE]"; 
        // ==========================================

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');
            
            // État de chargement
            btn.innerHTML = "Envoi en cours...";
            btn.disabled = true;
            btn.classList.add('opacity-75');
            statusDiv.classList.add('hidden');

            // Récupération des données du formulaire
            const orderData = {
                p_api_key: API_KEY_CLIENT,
                p_produit_id: PRODUIT_ID,
                p_nom_client: document.getElementById('nom').value,
                p_telephone: document.getElementById('telephone').value,
                p_wilaya: document.getElementById('wilaya').value,
                p_commune: document.getElementById('commune').value,
                p_quantite: parseInt(document.getElementById('quantite').value)
            };

            try {
                // Appel API REST vers Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/creer_commande_site`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    // Succès !
                    statusDiv.textContent = "Commande validée ! Vérifiez votre application.";
                    statusDiv.className = "p-3 rounded-lg text-sm font-medium text-center bg-green-100 text-green-800 block";
                    document.getElementById('orderForm').reset();
                } else {
                    // Erreur Supabase (ex: stock insuffisant, mauvaise clé)
                    const error = await response.json();
                    throw new Error(error.message || "Erreur lors de la commande");
                }
            } catch (error) {
                // Affichage de l'erreur
                statusDiv.textContent = "Erreur : " + error.message;
                statusDiv.className = "p-3 rounded-lg text-sm font-medium text-center bg-red-100 text-red-800 block";
            } finally {
                // Restauration du bouton
                btn.innerHTML = "Confirmer l'achat";
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
